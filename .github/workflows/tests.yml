name: Tests

on:
  pull_request:
  push:
    branches: [main, test]
  merge_group:

jobs:
  test:
    name: Python
    permissions:
      contents: read
    # The tskit-dev reusable python-tests workflow consumes
    # secrets.CODECOV_TOKEN without declaring it under workflow_call.secrets,
    # so it can only be provided via `secrets: inherit`.
    uses: tskit-dev/.github/.github/workflows/python-tests.yml@v17  # zizmor: ignore[secrets-inherit]
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python }}
      pyproject-directory: .
      coverage-directory: tscompare
    secrets: inherit
    strategy:
      matrix:
        python: ["3.11", "3.13"]
        os: [macos-latest, ubuntu-24.04, windows-latest]
